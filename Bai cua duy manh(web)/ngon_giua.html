<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất ngờ chưa!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .finger {
            font-size: 150px;
            display: inline-block;
            transform: translateY(100vh); /* Start hidden below the screen */
            animation: popUp 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .message {
            margin-top: 20px;
            font-size: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-in 1.5s forwards; /* Fades in after the finger pops up */
        }

        @keyframes popUp {
            0% {
                transform: translateY(100vh) scale(0.5);
            }
            70% {
                transform: translateY(-20px) scale(1.1);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="finger">🖕</div>
        <div class="message">Em tặng chị nè</div>
    </div>
</body>
</html>
