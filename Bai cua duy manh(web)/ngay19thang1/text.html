        <select id="City" name="city" required>
            <option value="">Select your city</option>

            <option value="hcm">Ho Chi Minh</option>
        </select>
    </p>

    <p><input type="button" value="Subscribe" onclick="window.location.href='https://www.google.com/'"></p>
</form>
